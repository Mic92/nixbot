version: "2"
plugins:
  - name: python
    wasm:
      # Kept in sync with nix/sqlc.nix (the dev shell and the freshness
      # check use the nix-pinned copy of the same artifact).
      url: https://github.com/rayakame/sqlc-gen-better-python/releases/download/v0.9.0/sqlc-gen-better-python.wasm
      sha256: d1787aa32e61f2e73c81a4f93b3e5a9beeec918952cff3183fb96313057f58a8
sql:
  - engine: postgresql
    queries: nixbot/nixbot/queries
    schema: nixbot/nixbot/migrations
    codegen:
      - out: nixbot/nixbot/db_gen
        plugin: python
        options:
          package: nixbot.db_gen
          emit_init_file: true
          sql_driver: asyncpg
          model_type: dataclass
          docstrings: none
          omit_unused_models: true
